name: Build and push web image

# Prebuilds the Next.js app image and pushes it to GHCR, for Koyeb's
# docker-compose.koyeb.yml to pull. Koyeb's free instance (512MB RAM,
# 0.1 vCPU) can't afford to `bun install && next build` on every cold
# start, so that build happens here instead — see Dockerfile.koyeb.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "Dockerfile"
      - "package.json"
      - "bun.lock"
      - "next.config.js"
      - "tsconfig.json"
      - "middleware.ts"
      - ".github/workflows/build-web-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
