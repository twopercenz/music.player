name: Deploy

# Builds the web app image and ships it to web-vm-e2-micro (Oracle Cloud).
# Doesn't touch invidious_companion (companion-vm) — that's deployed
# separately and changes far less often; see the repo's Oracle Cloud notes.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        run: echo "image=ghcr.io/${{ github.repository_owner }}/music-player-web" >> "$GITHUB_OUTPUT"

      # web-vm-e2-micro is VM.Standard.E2.1.Micro (amd64) — build only for
      # that, not a multi-arch manifest, to keep build time down.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:latest
            ${{ steps.image.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            sudo docker pull ${{ needs.build-and-push.outputs.image }}:latest
            sudo docker stop web || true
            sudo docker rm web || true
            sudo docker run -d --name web \
              -p 3000:3000 \
              --env-file /home/ubuntu/.env \
              --restart unless-stopped \
              ${{ needs.build-and-push.outputs.image }}:latest
            sudo docker image prune -f
